name: CI

# Roda como CI (push na main / PR / manual) e como ETAPA DE BUILD do release.yml (workflow_call): mesmos testes, mesmo
# smoke do binário — o que é publicado é exatamente o que passou aqui. Repo público → Actions grátis (runners padrão).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: 'Versão do binário (X.Y.Z) — vira ${revision} do Maven; vazio = 1.0.0-SNAPSHOT'
        type: string
        default: ''
      matriz:
        description: 'JSON da matriz de runners (release acrescenta macos-15-intel para o macos-x64)'
        type: string
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && !startsWith(github.ref, 'refs/tags/') }}

env:
  # -Drevision=X.Y.Z só quando o release pede; no CI comum fica o default do pom
  REVISAO_ARG: ${{ inputs.revision != '' && format('-Drevision={0}', inputs.revision) || '' }}

jobs:
  test:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      # ubuntu-22.04 de propósito: o .deb gerado no 24.04 declara Depends: libasound2t64 e NÃO instala em Ubuntu 22.04 LTS/Debian 12/Mint 21;
      # o gerado no 22.04 (libasound2) instala nos dois (o t64 faz Provides: libasound2). Adversarial F3 R3.
      matrix: ${{ fromJSON(inputs.matriz != '' && inputs.matriz || '{"os":["ubuntu-22.04","windows-latest","macos-latest"]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ── Linux: CUPS + impressora virtual "PDF" (printer-driver-cups-pdf) → o agente imprime via `lp` ─────────
      - name: Impressora virtual (Linux — cups-pdf)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cups cups-client printer-driver-cups-pdf
          sudo systemctl start cups || sudo service cups start
          for i in $(seq 1 30); do lpstat -p PDF >/dev/null 2>&1 && break; sleep 1; done
          lpstat -p -d
          mkdir -p "$HOME/PDF"
          echo "IMPRESSORA_VIRTUAL=PDF" >> "$GITHUB_ENV"
          echo "IMPRESSAO_SAIDA=$HOME/PDF" >> "$GITHUB_ENV"

      # ── Windows: "Microsoft Print to PDF" apontada para uma PORTA DE ARQUIVO → impressão silenciosa via PrinterJob ──
      - name: Impressora virtual (Windows — Microsoft Print to PDF → porta de arquivo)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $saida = "C:\saida"
          New-Item -ItemType Directory -Force -Path $saida | Out-Null
          $porta = "$saida\cupom.pdf"
          if (-not (Get-Printer -Name "Microsoft Print to PDF" -ErrorAction SilentlyContinue)) {
            Write-Host "Habilitando o recurso Print to PDF..."
            Enable-WindowsOptionalFeature -Online -FeatureName Printing-PrintToPDFServices-Features -NoRestart | Out-Null
          }
          if (-not (Get-PrinterPort -Name $porta -ErrorAction SilentlyContinue)) { Add-PrinterPort -Name $porta }
          Set-Printer -Name "Microsoft Print to PDF" -PortName $porta
          Get-Printer | Select-Object Name, PortName, PrinterStatus | Format-Table -AutoSize
          Add-Content -Path $env:GITHUB_ENV -Value "IMPRESSORA_VIRTUAL=Microsoft Print to PDF"
          Add-Content -Path $env:GITHUB_ENV -Value "IMPRESSAO_SAIDA=$porta"

      # ── macOS: sem impressora virtual pronta no runner → unitários + enumeração (impressão real fica p/ Mac físico) ──

      # Dois passos de propósito: o reator do Maven é fail-fast por dependência — se a impressão virtual (ambiente do
      # runner: CUPS/Print to PDF) falhasse no MESMO comando, o agente-core (handshake/bind, código de produção)
      # apareceria como SKIPPED nesse SO. Aqui os unitários de TODOS os módulos rodam sempre; a impressão real é à parte.
      - name: Testes unitários (todos os módulos, sem impressora)
        id: unitarios
        shell: bash
        run: ./mvnw -B -ntp $REVISAO_ARG test -Djava.awt.headless=true

      # F3-L3: além do motor, o PROTOCOLO inteiro (hello → auth → imprimir por WebSocket) contra a impressora virtual.
      - name: Impressão virtual (motor + protocolo WS → PDF real via spooler do SO)
        if: always() && env.IMPRESSORA_VIRTUAL != ''
        shell: bash
        run: |
          # -am: agente-core depende de agente-protocolo (F3-L0) e o passo 1 não instala nada no repositório local
          ./mvnw -B -ntp $REVISAO_ARG -pl agente-impressao,agente-core -am test -Djava.awt.headless=true -Dsun.java2d.print.polling=false \
            "-Dimpressora.virtual=${IMPRESSORA_VIRTUAL}" "-Dimpressao.saida=${IMPRESSAO_SAIDA}"

      # ── Empacotamento: o MESMO código dos testes vira o binário que a loja instala (jlink + jpackage) ─────────────
      # Os passos abaixo dependem SÓ dos unitários: um vermelho na impressão virtual (ambiente do runner) não pode
      # esconder o empacotamento — foi o que aconteceu no run 34127331719 (Windows: empacotar SKIPPED).
      - name: WiX 3 (Windows — exigido pelo jpackage para .exe)
        if: always() && runner.os == 'Windows' && steps.unitarios.outcome == 'success'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue) -and -not $env:WIX) {
            choco install wixtoolset --no-progress -y
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          } else { Write-Host "WiX presente: $env:WIX" }

      - name: Empacotar (jlink runtime enxuto + jpackage app-image + instalador do SO)
        id: empacotar
        if: always() && steps.unitarios.outcome == 'success'
        shell: bash
        run: ./mvnw -B -ntp $REVISAO_ARG -pl agente-app -am -DskipTests -Pempacotar package

      # Smoke DO BINÁRIO gerado (não do jar): versão, diagnóstico (Ed25519 = módulo jdk.crypto.ec no runtime jlink;
      # javax.print = java.desktop) e impressão REAL na impressora virtual onde houver. Usa o launcher -cli (Windows: o
      # launcher principal é GUI, sem stdout).
      - name: Smoke do binário empacotado
        if: always() && steps.empacotar.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          DIST=agente-app/target/dist
          NOME=AgroEase-Agente-Impressao
          case "$RUNNER_OS" in
            Linux)   BIN="$DIST/$NOME/bin/$NOME-cli" ;;
            macOS)   BIN="$DIST/$NOME.app/Contents/MacOS/$NOME-cli" ;;
            Windows) BIN="$DIST/$NOME/$NOME-cli.exe" ;;
          esac
          # Versão ÚNICA (F3-L0): o binário anuncia exatamente ${revision} do pom (MANIFEST → hello_ok e /parear) e o
          # instalador leva a mesma versão sem sufixo. "dev" ou 0.1.0-spike aqui = build quebrado (426 no pareamento).
          V=$(./mvnw -q -B -ntp $REVISAO_ARG help:evaluate -Dexpression=revision -DforceStdout)
          echo "== --versao (esperado: $V)"; SAIDA=$("$BIN" --versao); echo "$SAIDA"
          grep -qF "AgroEase $V " <<<"$SAIDA " || { echo "versão do binário ($SAIDA) não é a do pom ($V)"; exit 1; }
          grep -qiE "dev|spike" <<<"$SAIDA" && { echo "versão de desenvolvimento no binário: $SAIDA"; exit 1; }
          V_INST="${V%%-*}"
          ls "$DIST" | grep -qF "$V_INST" || { echo "instalador em $DIST não leva a versão $V_INST:"; ls -la "$DIST"; exit 1; }
          if [ "$RUNNER_OS" = "Linux" ]; then
            # adversarial F3 R3: o jpackage copia as deps do host de build; um Depends com sufixo t64 (Ubuntu 24.04) não instala em
            # 22.04 LTS/Debian 12/Mint 21. O runner é ubuntu-22.04 de propósito — esta guarda impede um upgrade silencioso do runner.
            DEPS=$(dpkg-deb -f "$DIST"/*.deb Depends); echo "Depends do .deb: $DEPS"
            grep -q "t64" <<<"$DEPS" && { echo ".deb com dependência t64 (host de build novo demais) — não instala em Ubuntu 22.04/Debian 12"; exit 1; }
          fi
          echo "== --diagnostico"; "$BIN" --diagnostico
          if [ -n "${IMPRESSORA_VIRTUAL:-}" ]; then
            echo "== impressão real pelo binário em '$IMPRESSORA_VIRTUAL'"
            "$BIN" --gerar-pdf-teste agente-app/target/teste-smoke.pdf
            if [ "$RUNNER_OS" = "Windows" ]; then
              rm -f "$IMPRESSAO_SAIDA"
              "$BIN" --imprimir-teste "$IMPRESSORA_VIRTUAL" agente-app/target/teste-smoke.pdf
              # o spooler cria o arquivo vazio e vai escrevendo: esperar não vazio E tamanho estável por 2 s
              ANT=-1; for i in $(seq 1 60); do
                T=$(stat -c %s "$IMPRESSAO_SAIDA" 2>/dev/null || echo 0)
                if [ "$T" -gt 0 ] && [ "$T" = "$ANT" ]; then break; fi
                ANT=$T; sleep 2
              done
              [ "$(stat -c %s "$IMPRESSAO_SAIDA" 2>/dev/null || echo 0)" -gt 0 ] || { echo "PDF não saiu em $IMPRESSAO_SAIDA"; exit 1; }
              ls -la "$IMPRESSAO_SAIDA"
            else
              ANTES=$(ls "$IMPRESSAO_SAIDA" | wc -l)
              "$BIN" --imprimir-teste "$IMPRESSORA_VIRTUAL" agente-app/target/teste-smoke.pdf
              for i in $(seq 1 60); do [ "$(ls "$IMPRESSAO_SAIDA" | wc -l)" -gt "$ANTES" ] && break; sleep 1; done
              [ "$(ls "$IMPRESSAO_SAIDA" | wc -l)" -gt "$ANTES" ] || { echo "PDF não saiu em $IMPRESSAO_SAIDA"; exit 1; }
              ls -la "$IMPRESSAO_SAIDA"
            fi
          fi
          # F3-L5: "iniciar com o sistema" pelo binário — instala, confere, desinstala (idempotente) no mecanismo de cada SO
          # (Run do Windows / LaunchAgent / systemd --user + .desktop). Pasta de dados isolada; no Linux o XDG_CONFIG_HOME
          # também, para não tocar o ~/.config do runner. Sem sessão gráfica, launchctl/systemctl podem falhar: só avisam.
          echo "== autostart (--instalar / --status / --desinstalar)"
          DADOS_CI="$RUNNER_TEMP/agente-ci-dados"; export XDG_CONFIG_HOME="$RUNNER_TEMP/agente-ci-xdg"; mkdir -p "$XDG_CONFIG_HOME"
          "$BIN" --instalar --dir-dados "$DADOS_CI"
          "$BIN" --status --dir-dados "$DADOS_CI" | tee /tmp/status.txt
          grep -q "Iniciar com o sistema: ativado" /tmp/status.txt || { echo "autostart não ficou ativado"; exit 1; }
          case "$RUNNER_OS" in
            Linux)   test -f "$XDG_CONFIG_HOME/autostart/agroease-agente-impressao.desktop" ;;
            macOS)   test -f "$HOME/Library/LaunchAgents/br.com.agroease.agente.impressao.plist" ;;
            Windows) MSYS_NO_PATHCONV=1 reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v AgroEaseAgenteImpressao ;;  # sem isso o Git Bash troca /v por um caminho
          esac
          "$BIN" --instalar --dir-dados "$DADOS_CI" >/dev/null   # idempotente
          "$BIN" --desinstalar --dir-dados "$DADOS_CI"
          "$BIN" --status --dir-dados "$DADOS_CI" | grep -q "Iniciar com o sistema: desativado" || { echo "autostart não foi removido"; exit 1; }
          "$BIN" --desinstalar --dir-dados "$DADOS_CI" >/dev/null  # idempotente
          unset XDG_CONFIG_HOME
          # exatamente UM binding de log no binário (slf4j-jdk14 → arquivo); um 2º (slf4j-simple) mandaria o log para o lugar errado
          echo "== bindings de log"
          SAIDA_VERSAO=$("$BIN" --versao 2>&1 || true)   # capturar antes de grep: com pipefail, grep -q fechando o pipe derruba o passo
          grep -q "multiple SLF4J providers" <<<"$SAIDA_VERSAO" && { echo "dois bindings SLF4J no binário"; exit 1; } || echo "1 binding, ok"
          echo "== tamanhos"
          du -sh agente-app/target/runtime "$DIST"/* || true
          echo "== módulos do runtime embutido"
          case "$RUNNER_OS" in
            macOS)   "$DIST/$NOME.app/Contents/runtime/Contents/Home/bin/java" --list-modules ;;
            Windows) "$DIST/$NOME/runtime/bin/java.exe" --list-modules ;;
            *)       "$DIST/$NOME/lib/runtime/bin/java" --list-modules ;;
          esac

      - name: Evidência — PDFs gerados pela impressora virtual
        if: always() && runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: impressao-${{ matrix.os }}
          path: |
            ~/PDF/*.pdf
            C:\saida\*.pdf
          if-no-files-found: ignore
          retention-days: 7

      # F3-L6: nomes canônicos AgroEase-Agente-Impressao-<V>-<so>-<arch>.<ext> (as chaves que o backend F1 conhece:
      # windows | linux | macos-arm64 | macos-x64) e, no macOS, prova de que o jpackage assinou ad-hoc (Gatekeeper exige).
      - name: Renomear instalador (so-arch) e verificar assinatura macOS
        if: always() && steps.empacotar.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          DIST=agente-app/target/dist; NOME=AgroEase-Agente-Impressao
          # nome do asset leva a versão COMPLETA (inclusive -rc1): é ela que o montar-latest.sh e o latest.json usam; o instalador
          # por dentro continua X.Y.Z (jpackage recusa sufixo) — adversarial F3 R1
          V=$(./mvnw -q -B -ntp $REVISAO_ARG help:evaluate -Dexpression=revision -DforceStdout)
          case "$(uname -m)" in x86_64|amd64) ARCH=x64 ;; arm64|aarch64) ARCH=arm64 ;; *) ARCH="$(uname -m)" ;; esac
          case "$RUNNER_OS" in
            Linux)   SO=linux;   EXT=deb; ORIG=$(ls "$DIST"/*.deb) ;;
            Windows) SO=windows; EXT=exe; ORIG=$(ls "$DIST"/*.exe) ;;
            macOS)   SO=macos;   EXT=dmg; ORIG=$(ls "$DIST"/*.dmg)
                     # o Gatekeeper exige ao menos assinatura ad-hoc: verificar o .app do app-image E o que vai DENTRO do .dmg (R5)
                     codesign --verify --strict --deep "$DIST/$NOME.app" || { echo "assinatura ad-hoc ausente/inválida no app-image"; exit 1; }
                     PONTO="$RUNNER_TEMP/dmg"; mkdir -p "$PONTO"
                     hdiutil attach -nobrowse -readonly -mountpoint "$PONTO" "$ORIG" >/dev/null
                     codesign --verify --strict --deep "$PONTO/$NOME.app" || { hdiutil detach "$PONTO" >/dev/null; echo "assinatura inválida dentro do .dmg"; exit 1; }
                     codesign -dv "$PONTO/$NOME.app" 2>&1 | grep -E "Signature|Identifier|TeamIdentifier" || true
                     hdiutil detach "$PONTO" >/dev/null
                     echo "codesign OK (ad-hoc) no app-image e no .dmg" ;;
          esac
          NOVO="$DIST/$NOME-$V-$SO-$ARCH.$EXT"
          mv -v "$ORIG" "$NOVO"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # F6 D1: app-image relocável em tar.gz — instalação por usuário (~/.local) sem root, é o formato que se AUTO-ATUALIZA
            # no Linux (o .deb em /opt exige senha; fica como "avisar + 1 clique"). Mesmo conteúdo que o CI acabou de testar.
            tar -C "$DIST" -czf "$DIST/$NOME-$V-$SO-$ARCH.tar.gz" "$NOME"
            tar -tzf "$DIST/$NOME-$V-$SO-$ARCH.tar.gz" > "$RUNNER_TEMP/tar-lista.txt"   # listar ANTES de grep: com pipefail, grep -q fechando o pipe derruba o tar
            grep -q "^$NOME/bin/$NOME$" "$RUNNER_TEMP/tar-lista.txt" || { echo "tar.gz sem o launcher"; exit 1; }
          fi
          ls -la "$DIST"

      # ── F6-L2: self-update REAL neste SO — instala a versão atual, publica uma release falsa 9.9.9 (build real do mesmo código,
      #    assinada com par DESCARTÁVEL via override -D, plano D11) num servidor loopback e deixa o agente se atualizar sozinho:
      #    Linux = tar.gz por usuário (rename-swap), Windows = .exe /qn do jpackage (upgrade MSI in-place, o risco em aberto do recon),
      #    macOS = troca do .app a partir do .dmg (hdiutil/ditto/codesign). Sai verde só se o binário INSTALADO passa a responder 9.9.9.
      - name: Self-update real (release falsa 9.9.9 assinada, servidor loopback)
        if: always() && steps.empacotar.outcome == 'success'
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          DIST=agente-app/target/dist; NOME=AgroEase-Agente-Impressao
          # Windows: RUNNER_TEMP vem como D:\a\_temp — bash/openssl/python querem POSIX (/d/a/_temp), a JVM quer Windows (D:\…)
          if [ "$RUNNER_OS" = "Windows" ]; then SMK="$(cygpath -u "$RUNNER_TEMP")/f6"; SMK_JVM="$(cygpath -w "$RUNNER_TEMP")\\f6"; else SMK="$RUNNER_TEMP/f6"; SMK_JVM="$SMK"; fi
          rm -rf "$SMK"; mkdir -p "$SMK/home/.local/share/agroease/agente-impressao" "$SMK/dados" "$SMK/art" "$SMK/apps"
          case "$(uname -m)" in x86_64|amd64) ARCH=x64 ;; arm64|aarch64) ARCH=arm64 ;; *) ARCH="$(uname -m)" ;; esac
          echo "== 1) instalar a versão ATUAL como a loja instalaria"
          case "$RUNNER_OS" in
            Linux)   cp -a "$DIST/$NOME" "$SMK/home/.local/share/agroease/agente-impressao/"; INST="$SMK/home/.local/share/agroease/agente-impressao/$NOME"; CLI="$INST/bin/$NOME-cli" ;;
            macOS)   cp -a "$DIST/$NOME.app" "$SMK/apps/"; INST="$SMK/apps/$NOME.app"; CLI="$INST/Contents/MacOS/$NOME-cli" ;;
            Windows) EXE=$(ls "$DIST"/*.exe | head -1)
                     MSYS_NO_PATHCONV=1 "$EXE" /qn /norestart /L*v "$SMK_JVM\\msi-install.log"   # o wrapper do jpackage repassa ao msiexec
                     INST="$LOCALAPPDATA/$NOME"; CLI="$INST/$NOME-cli.exe"; ls "$INST" ;;
          esac
          "$CLI" --versao
          echo "== 2) build 9.9.9 (mesmo código) em dist separado"
          ./mvnw -B -ntp -q -Drevision=9.9.9 "-Dapp.dist=$PWD/agente-app/target/dist-999" -pl agente-app -am -DskipTests -Pempacotar package
          D9=agente-app/target/dist-999; ls "$D9"
          case "$RUNNER_OS" in
            Linux)   tar -C "$D9" -czf "$SMK/art/$NOME-9.9.9-linux-x64.tar.gz" "$NOME"; cp "$D9"/*.deb "$SMK/art/$NOME-9.9.9-linux-x64.deb" ;;
            macOS)   cp "$D9"/*.dmg "$SMK/art/$NOME-9.9.9-macos-$ARCH.dmg" ;;
            Windows) cp "$D9"/*.exe "$SMK/art/$NOME-9.9.9-windows-x64.exe" ;;
          esac
          echo "== 3) release falsa assinada com par descartável, servida em 127.0.0.1"
          openssl genpkey -algorithm ed25519 -out "$SMK/priv.pem"
          (cd "$SMK/art" && bash "$GITHUB_WORKSPACE/scripts/release/montar-latest.sh" 9.9.9 . Cura23/wagsyspet-agente "$SMK/priv.pem" 1 >/dev/null)
          python3 - "$SMK/art/latest.json" <<'PY'
          import sys; p=sys.argv[1]; s=open(p).read().replace("https://github.com/Cura23/wagsyspet-agente/releases/download/v9.9.9/","http://127.0.0.1:8770/"); open(p,"w").write(s)
          PY
          openssl pkeyutl -sign -inkey "$SMK/priv.pem" -rawin -in "$SMK/art/latest.json" -out "$SMK/art/latest.json.sig"
          PUB=$(openssl pkey -in "$SMK/priv.pem" -pubout | grep -v -- '-----' | tr -d '\n')
          (cd "$SMK/art" && python3 -m http.server 8770 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for i in $(seq 1 30); do curl -sf --max-time 3 http://127.0.0.1:8770/latest.json >/dev/null 2>&1 && break; sleep 1; done
          curl -sf --max-time 5 http://127.0.0.1:8770/latest.json | head -c 200; echo
          echo "== 4) --atualizar pelo binário INSTALADO (sem tela: o agente relançado só orienta e sai)"
          export AGROEASE_AGENTE_DIR="$SMK_JVM/dados"
          export JAVA_TOOL_OPTIONS="-Duser.home=$SMK_JVM/home -Dagente.release.manifesto.url=http://127.0.0.1:8770/latest.json -Dagente.release.chave.publica=$PUB"
          unset DISPLAY WAYLAND_DISPLAY || true
          "$CLI" --atualizar
          echo "== 5) aguardar o atualizador"
          for i in $(seq 1 120); do
            grep -qE 'relançado|Falha|cancelada|ilegível' "$SMK/dados/atualizacao/atualizador.log" 2>/dev/null && break
            sleep 2
          done
          echo "--- atualizador.log"; cat "$SMK/dados/atualizacao/atualizador.log" || { echo "sem atualizador.log"; ls -la "$SMK/dados/atualizacao" || true; exit 1; }
          grep -q "Instalado:" "$SMK/dados/atualizacao/atualizador.log" || { echo "instalador não concluiu"; cat "$SMK/dados/atualizacao/estado.json" || true; cat "$SMK"/dados/logs/*.log 2>/dev/null | tail -30 || true; exit 1; }
          sleep 3
          echo "== 6) o binário instalado agora é a 9.9.9?"
          unset JAVA_TOOL_OPTIONS
          SAIDA=$("$CLI" --versao 2>&1); echo "$SAIDA"
          grep -qF "AgroEase 9.9.9 " <<<"$SAIDA " || { echo "instalado NÃO virou 9.9.9"; exit 1; }
          echo "--- estado.json"; cat "$SMK/dados/atualizacao/estado.json"
          grep -q '"versaoNova" : "9.9.9"' "$SMK/dados/atualizacao/estado.json"
          case "$RUNNER_OS" in
            Linux) "$SMK/dados/atualizacao/anterior/$NOME/bin/$NOME-cli" --versao | grep -qF "AgroEase $(./mvnw -q -B -ntp $REVISAO_ARG help:evaluate -Dexpression=revision -DforceStdout) " && echo "anterior guardado OK" ;;
            macOS) ls "$SMK/dados/atualizacao/anterior/$NOME.app/Contents/MacOS/$NOME-cli" && echo "anterior guardado OK" ;;
            Windows) echo "(Windows: sem instalador anterior guardado nesta build — rollback via download da release anterior, quando existir)" ;;
          esac
          echo "== 7) limpeza: encerrar o agente relançado (se ficou vivo) e o servidor"
          pkill -f "$NOME" || true; pkill -f "http.server 8770" || true
          unset AGROEASE_AGENTE_DIR
          echo "self-update real OK neste SO"

      - name: Evidência — instalador gerado pelo jpackage
        if: always() && steps.empacotar.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            agente-app/target/dist/AgroEase-Agente-Impressao-*.deb
            agente-app/target/dist/AgroEase-Agente-Impressao-*.exe
            agente-app/target/dist/AgroEase-Agente-Impressao-*.dmg
            agente-app/target/dist/AgroEase-Agente-Impressao-*.tar.gz
          if-no-files-found: error
          retention-days: 7
