# Configuração embutida do Agente de Impressão AgroEase (plano F3 D17).
# URL pública do backend de produção (a mesma do PWA em app.agroease.com.br). Override em ordem de prioridade:
#   --backend-url <url>  |  env AGROEASE_BACKEND_URL  |  -Dagente.backend=<url>
# Só https:// (ou http://localhost|127.0.0.1 em desenvolvimento).
backend.url=https://wagsyspet-backend-production.up.railway.app
# Manifesto assinado da release publicada (self-update, plano F6 D3). Endereço FIXO do GitHub Releases: "latest" aponta para a
# última release não-prerelease; a assinatura Ed25519 (latest.json.sig) é o que o agente confia, não o endereço.
# Override para suporte/CI: -Dagente.release.manifesto.url=<url> (e -Dagente.release.chave.publica=<SPKI b64>, com WARN no log).
release.manifesto.url=https://github.com/Cura23/wagsyspet-agente/releases/latest/download/latest.json
